# nginx sample for self-hosting the Atlantis HUD web client.
#
# Serves the unpacked `site/` directory from the root of an HTTPS domain or subdomain - see
# README.md for why root-only, HTTPS and the wasm MIME type are all required rather than optional.
# Fill in `server_name` and the certificate paths for your host, then drop this into
# /etc/nginx/sites-available/ (or conf.d/) and reload nginx.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hud.example.com;

    # Fill in your certificate. certbot/acme.sh or your host's TLS termination normally provides
    # these paths for you.
    ssl_certificate     /etc/letsencrypt/live/hud.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hud.example.com/privkey.pem;

    # Point this at the unpacked site/ directory - the contents, not the tarball's own top-level
    # directory.
    root /var/www/atlantis-hud/site;
    index index.html;

    # Vite emits .wasm; some distros' mime.types predate it, and without this the WASM core fails
    # to instantiate silently.
    types { application/wasm wasm; }

    # Content-hashed bundles: a new build never reuses an old file's name, so these are safe to
    # cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry points a returning browser checks for a new build. Cache these and an update never
    # reaches anyone who has already visited.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: no server-side router, so unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Plain HTTP should redirect to HTTPS rather than serve the app - the service worker will not
# register over it, so serving the app there just produces a broken-looking site with no error.
server {
    listen 80;
    listen [::]:80;
    server_name hud.example.com;
    return 301 https://$host$request_uri;
}
