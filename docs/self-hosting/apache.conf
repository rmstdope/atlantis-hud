# Apache 2.4 sample for self-hosting the Atlantis HUD web client.
#
# Serves the unpacked `site/` directory from the root of an HTTPS domain or subdomain - see
# README.md for why root-only, HTTPS and the wasm MIME type are all required rather than optional.
# Fill in ServerName and the certificate paths for your host, then drop this into
# /etc/apache2/sites-available/ and enable it (a2ensite).
#
# Requires mod_headers, mod_mime and mod_rewrite to be enabled:
#   a2enmod headers mime rewrite

<VirtualHost *:443>
    ServerName hud.example.com

    # Point this at the unpacked site/ directory - the contents, not the tarball's own top-level
    # directory.
    DocumentRoot /var/www/atlantis-hud/site

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/hud.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/hud.example.com/privkey.pem

    # Vite emits .wasm; some distros' mime.types predate it, and without this the WASM core fails
    # to instantiate silently.
    AddType application/wasm .wasm

    <Directory /var/www/atlantis-hud/site>
        Require all granted
        AllowOverride None
    </Directory>

    # Content-hashed bundles: a new build never reuses an old file's name, so these are safe to
    # cache forever.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # The entry points a returning browser checks for a new build. Cache these and an update never
    # reaches anyone who has already visited.
    <LocationMatch "^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # Single-page app: no server-side router, so unknown paths fall back to the shell.
    FallbackResource /index.html
</VirtualHost>

# Plain HTTP should redirect to HTTPS rather than serve the app - the service worker will not
# register over it, so serving the app there just produces a broken-looking site with no error.
<VirtualHost *:80>
    ServerName hud.example.com
    Redirect permanent / https://hud.example.com/
</VirtualHost>
