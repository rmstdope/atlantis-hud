:root{--bg:#14181d;--panel:#1d232a;--ink:#e6e9ec;--dim:#98a2ad;--line:#333c46;--accent:#6fb3d9}

<h1>Option A — The same drift, fewer redraws</h1><p>The sea drifts in the same direction at the same speed, but the picture is only redrawn 8 times a second. Watch both seas, then press "Zoomed right in", where any stepping would show most.</p>
<div class=bar><span>Map zoom:</span><button data-zoom=normal aria-pressed=true>Usual</button><button data-zoom=close aria-pressed=false>Zoomed right in</button></div>
<div class=pair><figure><svg data-mode=today></svg><figcaption><span>Today</span><em>the screen redraws as fast as it can, 60 times a second or more</em></figcaption></figure>
<figure><svg data-mode=steps8></svg><figcaption><span>Option A: 8 redraws a second</span><em>about an eighth of today's work, steady</em></figcaption></figure></div>

const R={normal:34,close:110};let zoom='normal';
const NS='http://www.w3.org/2000/svg';
function build(svg,id){svg.innerHTML='';const defs=document.createElementNS(NS,'defs');svg.appendChild(defs);
 const movers=[];[[0,1],[60,.9],[120,1.08],[300,.96]].forEach(([rot,br],i)=>{const p=document.createElementNS(NS,'pattern');
 p.id=id+i;p.setAttribute('patternUnits','objectBoundingBox');p.setAttribute('patternContentUnits','objectBoundingBox');p.setAttribute('width',1);p.setAttribute('height',1);
 p.setAttribute('patternTransform','rotate('+rot+' .5 .5)');const g=document.createElementNS(NS,'g');
 [-1,0,1].forEach(x=>{const m=document.createElementNS(NS,'image');m.setAttribute('href',IMG);m.setAttribute('x',x);m.setAttribute('y',0);m.setAttribute('width',1);m.setAttribute('height',1);m.setAttribute('preserveAspectRatio','xMidYMid slice');m.style.filter='brightness('+br+')';g.appendChild(m)});
 p.appendChild(g);defs.appendChild(p);movers.push(g)});
 const r=R[zoom],w=Math.sqrt(3)*r,h=1.5*r;let n=0;
 for(let row=-1;row<340/h+1;row++)for(let col=-1;col<560/w+1;col++){const cx=col*w+(row%2?w/2:0),cy=row*h;let d='';for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-90);d+=(k?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)}
 const q=document.createElementNS(NS,'path');q.setAttribute('d',d+'Z');q.setAttribute('fill','url(#'+id+((col*7+row*3+n++)%4+4)%4+')');q.setAttribute('stroke','#0c1116');q.setAttribute('stroke-opacity','.45');svg.appendChild(q)}

let sets=[];function rebuild(){sets=[...document.querySelectorAll('svg[data-mode]')].map((s,i)=>({mode:s.dataset.mode,g:build(s,'t'+i+'_')}))}
const T=18000;
function pos(mode,ms){if(mode==='today')return (ms%T)/T;
 if(mode==='steps8'){const st=125;return (Math.floor(ms/st)*st%T)/T}
 if(mode==='steps4'){const st=250;return (Math.floor(ms/st)*st%T)/T}
 if(mode==='steps2'){const st=500;return (Math.floor(ms/st)*st%T)/T}
 if(mode==='swell'){const c=10000,g=2000,k=Math.floor(ms/c),t=ms%c,dist=c/T;let f=0;if(t>c-g){const u=(t-(c-g))/g;f=u*u*(3-2*u)}return ((k+f)*dist)%1}}
function tick(ms){sets.forEach(s=>{const p=pos(s.mode,ms);s.g.forEach(g=>g.setAttribute('transform','translate('+p.toFixed(5)+' 0)'))});requestAnimationFrame(tick)}
document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{zoom=b.dataset.zoom;document.querySelectorAll('[data-zoom]').forEach(x=>x.setAttribute('aria-pressed',x===b));rebuild()});
