# A build directory per worktree, on purpose.
#
# This file is tracked, so every git worktree carries its own copy, and cargo resolves
# `target-dir` against the directory holding the *nearest* config it finds walking up from the
# working directory - which is the worktree's own root, not the repository's. Measured with the
# control, from a worktree, 2026-08-17:
#
#     $ cargo metadata --no-deps --format-version 1 | jq -r .target_directory
#     <repo>/.cerebro/worktrees/<bead>/target
#
# An earlier version of this comment claimed the opposite - "they all build into the one tree at
# the root" - which was never true once the file was tracked into every worktree (ah-gdp).
#
# Per-worktree is deliberate, not an accident left uncorrected: cargo takes a file lock on a build
# directory, so a genuinely shared tree would queue every implementer's Rust build behind every
# other one's, and this fleet runs three or more implementers at once. Parallel builds are worth
# the disk.
#
# The cost is roughly 2-3.5 GB per worktree. `.claude/cerebro/scripts/prune-worktrees.sh` reclaims
# a removed worktree's tree as part of removing the worktree itself, and reclaims a long-cold kept
# tree's `target/` on its own; the `disk_floor_gb` this project declares in
# .cerebro/project.conf - the floor `.claude/cerebro/scripts/disk-preflight` refuses to start
# a bead below - is sized for one worktree's build on top of what is already there.
#
# The path stays relative on purpose. An absolute one would work on the machine it was written on
# and break CI, which builds on Linux and caches `target/` at its default location. There is a test
# for exactly that in scripts/cargoTargetDir.test.ts.
#
# For the repository's own root checkout this changes nothing - `target/` is where cargo already
# put things - so CI and a plain clone are unaffected.
[build]
target-dir = "target"

# ts-rs (crates/core, ah-164.2) writes the TypeScript bindings during `cargo test`. Large integers
# cross as JSON numbers, so they are `number` in TypeScript, not `bigint`.
#
# Anchored to the crate, not to the working directory. `relative = true` made cargo resolve this
# value against the directory holding the *nearest* config found walking up from the WORKING
# DIRECTORY, so a run whose cwd was the main checkout and whose --manifest-path pointed into a
# worktree wrote that worktree's bindings into the main checkout's
# packages/core-client/src/generated. That happened on 2026-09-04 (ah-16pb). With
# `relative = false` cargo passes the value through untouched and ts-rs resolves it at run time
# against the test process's working directory - which cargo sets to the package root of the
# manifest being tested, `crates/core`, in this worktree or any other. Measured 2026-09-04 with
# cwd /tmp and the manifest in the repository: the bindings landed under the repository.
#
# `TS_RS_EXPORT_DIR` deliberately carries no `force = true`. Cargo's `[env]` only overrides a value
# already in the caller's environment when `force` is set, and scripts/checkGenerated.ts relies on
# that: it regenerates the bindings into a temporary tree by passing its own TS_RS_EXPORT_DIR. Add
# `force` here and that gate silently compares the working tree against itself.
[env]
TS_RS_EXPORT_DIR = { value = "../../packages/core-client/src/generated", relative = false }
TS_RS_LARGE_INT = "number"
