name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The web and desktop shells both run the Rust core as WebAssembly, so the module has to exist
  # before typecheck, tests or the smoke run. Built once here and handed to the jobs that need it,
  # which is what lets the smoke jobs skip the Rust toolchain entirely. No system toolchain is
  # needed: the core is pure Rust, and nothing in the wasm build compiles C.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The module itself, keyed on everything it is built from. Most changes touch no Rust at
      # all, and for those this job is a restore and an upload rather than a toolchain and a
      # build - which matters because every smoke and pwa job waits on it.
      - name: Cache the built module
        id: wasm-module
        uses: actions/cache@v4
        with:
          path: packages/browser-core/src/wasm
          key: wasm-module-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock') }}

      - name: Setup Rust
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Without this every job recompiles the whole workspace from scratch. Cold, the Rust steps
      # in this workflow came to about 212 seconds; warm they are a few.
      - name: Cache Rust build
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install wasm-pack
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # Through the ensure script rather than `build:wasm`, because the script writes the
      # fingerprint stamp beside the module. The stamp travels in the cache - not the artifact,
      # which drops hidden files, and whose consumers never build - and it is what lets the checks
      # job's `pretypecheck` hook see a restored module as current instead of rebuilding it. The
      # script needs no pnpm workspace, so this job installs none.
      - name: Build WebAssembly core
        if: steps.wasm-module.outputs.cache-hit != 'true'
        run: node scripts/ensure-wasm.mjs

      - name: Upload the WebAssembly core
        uses: actions/upload-artifact@v4
        with:
          name: wasm-core
          path: packages/browser-core/src/wasm
          retention-days: 1

  # The JavaScript half of the checks. Independent of the wasm job on purpose, so it runs beside
  # it rather than after: browser-core's pretypecheck hook can build the module itself, which is
  # also what keeps a fresh clone working locally. Most runs never do - the module cache below
  # restores it, stamp and all, and the hook sees it as current.
  #
  # `pnpm -r run typecheck` and `pnpm -r run test` rather than the root scripts, which chain
  # `cargo check` and `cargo test` on the end: the Rust half lives in the rust job beside this
  # one, where clippy subsumes the check.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache the built module
        id: wasm-module
        uses: actions/cache@v4
        with:
          path: packages/browser-core/src/wasm
          key: wasm-module-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      # The Rust toolchain is only here for the fallback where the module cache missed and the
      # pretypecheck hook has to build the module after all.
      - name: Setup Rust
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install wasm-pack
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm -r run typecheck

      - name: Run tests
        run: pnpm -r run test

  # The Rust half, beside the JavaScript half rather than after it. Everything here compiles for
  # the host, so it shares nothing with the wasm cache and keeps its own. `cargo check` from the
  # root typecheck script is absent deliberately: clippy over the same targets is a superset of it.
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native

      - name: Rust format check
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  # One job per Playwright project and shard, because the suite is deliberately single-worker. Two
  # of its tests measure how long the main thread is blocked, and anything running beside them
  # turns that into a measurement of contention - so parallelism is bought here, where each runner
  # walks its slice of one shell on its own, rather than inside Playwright. Two shards, because
  # each job pays a fixed ~45 seconds of setup before the first test runs: at two the split still
  # roughly halves the test time; at three the setup starts to dominate what it saves.
  #
  # These need no Rust at all: the wasm module arrives as an artifact.
  smoke:
    runs-on: ubuntu-latest
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        project: [web, desktop-shell]
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the WebAssembly core
        uses: actions/download-artifact@v4
        with:
          name: wasm-core
          path: packages/browser-core/src/wasm

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The browser itself caches; the system libraries it links against do not, so those are
      # installed either way.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run smoke tests
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      - name: Upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # The production build, which nothing else in this repository ever makes.
  #
  # Two things only exist in one: the service worker, so installability and offline cannot be tested
  # anywhere else, and `vite build` itself - a build that failed outright used to reach main
  # unnoticed, because every other job here runs against a dev server.
  #
  # Needs no Rust, for the same reason the smoke jobs do not: the wasm module arrives as an
  # artifact. It runs beside them rather than after, so it costs a runner and not wall-clock time.
  pwa:
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the WebAssembly core
        uses: actions/download-artifact@v4
        with:
          name: wasm-core
          path: packages/browser-core/src/wasm

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # `vite build` rather than the `build` script, which is `build:wasm && vite build`. The module
      # is already here, and rebuilding it would drag the Rust toolchain into a job that has none.
      - name: Build the web application
        run: pnpm --filter @atlantis/web exec vite build

      - name: Run the PWA tests
        run: pnpm run test:pwa

      - name: Upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pwa
          path: test-results
          retention-days: 7

  # The Tauri binary is gated behind `any(target_os = "linux", target_os = "macos", target_os = "windows")`
  # and the `desktop-runtime` feature. Without that feature the Linux jobs above compile the shell
  # without tauri and its native system-library dependencies. A missing dependency in the desktop
  # shell reached a developer's machine before this job existed.
  desktop-shell:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check the native desktop shell
        run: cargo check -p atlantis-hud-desktop-shell --features desktop-runtime

      - name: Clippy the native desktop shell
        run: cargo clippy -p atlantis-hud-desktop-shell --features desktop-runtime -- -D warnings
