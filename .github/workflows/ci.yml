name: CI

on:
  pull_request:
  push:
    branches: [main]

# No default GITHUB_TOKEN scope beyond these two: the `changes` job only ever reads a pull
# request's file list, and every job checks out the repository read-only.
permissions:
  contents: read
  pull-requests: read

# One run per ref (ah-pg3j). Two events on the same sha used to produce two complete, independent
# runs - 10 of 126 runs in the 72 hours to 2026-08-20 were a duplicate inside 60 seconds. The
# direct saving is small (~2.7% of a typical bead); the real one is contention, since duplicates
# cost most on exactly the days the Actions queue is already starving.
#
# `cancel-in-progress` is deliberately conditional. On a pull request, superseding an older run is
# what we want: only the newest head matters. On `main` it is not - cancelling an in-flight run
# there could kill the one gating a release, so pushes to main queue behind each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every required job below is gated on this job's `code` output, so a prose-only PR reports all
  # ten required checks - most of them skipped - in under a minute instead of waiting on the
  # ~10-minute suite that none of it can affect.
  #
  # Three exempt trees, none of them read by anything CI runs: docs/ is the project's own
  # documentation; .claude/ is the fleet's - agent roles, skills and settings, which shape how the
  # agents work and never reach the application; and .github/ is repository configuration, issue
  # templates and the like. Two root files join them, exact-matched: README.md and the CLAUDE.md
  # symlink path.
  #
  # .github/workflows/ is the exception to that exception, and runs everything - see the gate
  # itself below.
  #
  # The trigger above deliberately carries no `paths`/`paths-ignore`: a workflow skipped by path
  # filtering never reports its checks at all - Pending forever, not skipped - and that blocks the
  # merge instead of speeding it up. Only the jobs inside are conditional; the workflow itself
  # always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.gate.outputs.code }}
      # Whether this diff touches anything native-shaped - see the second condition below. Scoped
      # separately from `code` because `native` (the Linux Tauri job, the largest hang surface and
      # slowest job in this workflow) tests the IPC binding, not the shared UI: most diffs that need
      # the full suite still don't need this one job.
      native: ${{ steps.gate.outputs.native }}
    steps:
      - name: Determine whether this diff touches anything besides prose, and whether it is native-shaped
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push (to main) has no pull request file list to read, and nothing has diffed it
          # against a base - so it always runs everything.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A failed or empty listing also runs everything: this must fail open, since a gate
          # that fails closed turns an API blip into a merged, untested change.
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --paginate --jq '.[].filename' 2>/dev/null) || FILES=""

          # Two checks rather than one pattern, because POSIX ERE has no negative lookahead and
          # `.github/` is exempt while `.github/workflows/` is not. The workflows are what the gate
          # itself lives in, and the tests that guard it run inside the `checks` job below - exempt
          # those too and a PR editing this file would skip its own examiner.
          #
          # The three trees are exempt wholesale - nothing CI builds, tests or runs reads anything
          # under docs/, .claude/ or .github/ (workflows carved back out above). Two root files are
          # exempt too, exact-matched rather than as a prefix: README.md and the CLAUDE.md symlink
          # path (a PR that only retargets the symlink lists "CLAUDE.md" itself, not its target).
          #
          # Anchored on the directory or the whole filename, and the dots escaped: `^docs` would let
          # `docsite/build.ts` skip the suite, an unescaped `.claude` would match `xclaude/`, and an
          # unanchored `README\.md` would let `README.md.ts` skip it too.
          if [ -z "$FILES" ] \
            || echo "$FILES" | grep -q '^\.github/workflows/' \
            || echo "$FILES" | grep -qvE '^((docs|\.claude|\.github)/|README\.md$|CLAUDE\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          # native-shaped: the Rust core and its Tauri wrappers, the desktop shell, the IPC adapter
          # package, the native suite and what configures it, the workflow itself, and the two
          # manifest/lockfiles that change what the native job installs. A shared-UI change is
          # deliberately not in this list - the native suite tests the IPC binding
          # (tests/native/binding.spec.ts), not the UI - so it fails to match and the job is
          # scoped out. Fails open on an empty listing, same as `code` above.
          if [ -z "$FILES" ] \
            || echo "$FILES" | grep -qE '^(crates/|apps/desktop/|packages/core-client/|tests/native/|wdio\.conf\.ts$|\.github/workflows/|package\.json$|pnpm-lock\.yaml$|Cargo\.(toml|lock)$)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi
  # The web and desktop shells both run the Rust core as WebAssembly, so the module has to exist
  # before typecheck, tests or the smoke run. Built once here and handed to the jobs that need it,
  # which is what lets the smoke jobs skip the Rust toolchain entirely. No system toolchain is
  # needed: the core is pure Rust, and nothing in the wasm build compiles C.
  wasm:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The module itself, keyed on everything it is built from. Most changes touch no Rust at
      # all, and for those this job is a restore and an upload rather than a toolchain and a
      # build - which matters because every smoke and pwa job waits on it.
      - name: Cache the built module
        id: wasm-module
        uses: actions/cache@v4
        with:
          path: packages/browser-core/src/wasm
          key: wasm-module-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock') }}

      - name: Setup Rust
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Without this every job recompiles the whole workspace from scratch. Cold, the Rust steps
      # in this workflow came to about 212 seconds; warm they are a few.
      - name: Cache Rust build
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install wasm-pack
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # Through the ensure script rather than `build:wasm`, because the script writes the
      # fingerprint stamp beside the module. The stamp travels in the cache - not the artifact,
      # which drops hidden files, and whose consumers never build - and it is what lets the checks
      # job's `pretypecheck` hook see a restored module as current instead of rebuilding it. The
      # script needs no pnpm workspace, so this job installs none.
      - name: Build WebAssembly core
        if: steps.wasm-module.outputs.cache-hit != 'true'
        run: node scripts/ensure-wasm.mjs

      - name: Upload the WebAssembly core
        uses: actions/upload-artifact@v4
        with:
          name: wasm-core
          path: packages/browser-core/src/wasm
          retention-days: 1

  # The JavaScript half of the checks. Independent of the wasm job on purpose, so it runs beside
  # it rather than after: browser-core's pretypecheck hook can build the module itself, which is
  # also what keeps a fresh clone working locally. Most runs never do - the module cache below
  # restores it, stamp and all, and the hook sees it as current.
  #
  # `pnpm -r run typecheck` and `pnpm -r run test` rather than the root scripts, which chain
  # `cargo check` and `cargo test` on the end: the Rust half lives in the rust job beside this
  # one, where clippy subsumes the check.
  checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache the built module
        id: wasm-module
        uses: actions/cache@v4
        with:
          path: packages/browser-core/src/wasm
          key: wasm-module-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      # The Rust toolchain is only here for the fallback where the module cache missed and the
      # pretypecheck hook has to build the module after all.
      - name: Setup Rust
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install wasm-pack
        if: steps.wasm-module.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm -r run typecheck

      - name: Run tooling typecheck
        run: pnpm run typecheck:tooling

      - name: Run tests
        run: pnpm -r run test

      # The repository's own tooling under scripts/ belongs to no package, so the recursive run above
      # never reaches it.
      - name: Run tooling tests
        run: pnpm run test:tooling

  # The Rust half, beside the JavaScript half rather than after it. Everything here compiles for
  # the host, so it shares nothing with the wasm cache and keeps its own. `cargo check` from the
  # root typecheck script is absent deliberately: clippy over the same targets is a superset of it.
  rust:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native

      - name: Rust format check
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Generated TypeScript bindings are committed
        run: |
          # Unquoted below on purpose: each word is its own pathspec. Kept in step with
          # GENERATED_DIRS in scripts/checkGenerated.ts by scripts/generatedBindingsGate.test.ts.
          GENERATED="packages/core-client/src/generated packages/ruleset/src/generated"
          STALE="$(git status --porcelain -- $GENERATED)"
          if [ -n "$STALE" ]; then
            echo "$STALE"
            echo "::error::cargo test rewrote the generated TypeScript bindings; commit the result"
            exit 1
          fi

  # One job per Playwright project and shard, because the suite is deliberately single-worker. Two
  # of its tests measure how long the main thread is blocked, and anything running beside them
  # turns that into a measurement of contention - so parallelism is bought here, where each runner
  # walks its slice of one shell on its own, rather than inside Playwright. Two shards, because
  # each job pays a fixed ~45 seconds of setup before the first test runs: at two the split still
  # roughly halves the test time; at three the setup starts to dominate what it saves.
  #
  # These need no Rust at all: the wasm module arrives as an artifact.
  #
  # This job always runs and always expands its matrix - a job skipped by a job-level `if:` never
  # expands its matrix, which used to mean a docs-only PR needed a second job (`smoke-skip`), same
  # matrix, opposite condition, reporting the four required `smoke (<project>, <shardIndex>,
  # <shardTotal>)` contexts under an explicit `name:`. On a CODE PR the twin was the one skipped
  # instead, so IT never expanded either, and its `${{ matrix.* }}` `name:` posted uninterpolated -
  # a permanently-"skipping" check with a raw expression in its name, on every code PR (ah-2m2).
  # Gating every step instead keeps the four contexts reporting on every PR by construction, with
  # no job anywhere carrying a matrix expression in a `name:`. `!cancelled()` is what lets the job
  # (and therefore its matrix) still run when `wasm` was skipped on a prose-only PR, while still
  # dying on an actual cancellation.
  smoke:
    runs-on: ubuntu-latest
    needs: [changes, wasm]
    if: ${{ !cancelled() }}
    # Four minutes is the longest this job has taken when it works (measured over eight runs,
    # 2026-08-19). The ceiling is for the failure mode, not the work. It was added for the apt step
    # that ran on every run, hit or miss, and stalled 25-55 minutes four times in five days
    # (ah-3c80); the container below has since removed that step entirely (ah-f9q9). It stays as
    # defence in depth: unbounded, one hang holds a runner for an hour and the fleet queues behind
    # it; bounded, it is a fast failure anyone can re-run.
    timeout-minutes: 15
    # The libraries Playwright links against are baked into this image, so no apt runs here at all -
    # which is the failure `timeout-minutes` above exists to bound (ah-3c80, four stalls in five
    # days). The tag must match the version in pnpm-lock.yaml; `scripts/playwrightImage.test.ts`
    # fails the gate if they drift (ah-f9q9).
    #
    # The cost, measured rather than assumed (ah-vzj9): a job-level container is pulled before any
    # step gate is evaluated, and this job deliberately always expands its matrix so the four
    # required contexts always report (ah-2m2). So a prose-only PR pulls the image in all four
    # shards and then skips every step. Two one-file docs-only PRs either side of the change - a
    # sample of two, #461 and #467 - went from 21s to 135s of runner time across the four shards,
    # about 37s more wall-clock since they run in parallel. Weighed against a step that ran on
    # every code PR, hit or miss, and stalled 25-55 minutes four times in five days (ah-3c80), and
    # kept.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        project: [web, desktop-shell]
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download the WebAssembly core
        if: needs.changes.outputs.code == 'true' && needs.wasm.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wasm-core
          path: packages/browser-core/src/wasm

      # SMOKE_PROJECT keeps the config from also building and serving the shell this job is not
      # walking: Playwright starts every `webServer` entry no matter which project runs.
      - name: Run smoke tests
        if: needs.changes.outputs.code == 'true'
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          SMOKE_PROJECT: ${{ matrix.project }}

      - name: Upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shardIndex }}
          path: test-results
          retention-days: 7

  # The production build, which nothing else in this repository ever makes.
  #
  # Two things only exist in one: the service worker, so installability and offline cannot be tested
  # anywhere else, and `vite build` itself - a build that failed outright used to reach main
  # unnoticed, because every other job here runs against a dev server.
  #
  # Needs no Rust, for the same reason the smoke jobs do not: the wasm module arrives as an
  # artifact. It runs beside them rather than after, so it costs a runner and not wall-clock time.
  pwa:
    runs-on: ubuntu-latest
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true'
    # Same ceiling and the same reason as `smoke` above: kept as defence in depth against a hang
    # nobody has predicted yet, now that the image has removed the one that was measured.
    timeout-minutes: 15
    # The libraries Playwright links against are baked into this image, so no apt runs here at all -
    # which is the failure `timeout-minutes` above exists to bound (ah-3c80, four stalls in five
    # days). The tag must match the version in pnpm-lock.yaml; `scripts/playwrightImage.test.ts`
    # fails the gate if they drift (ah-f9q9). What a job-level container costs on the docs path is
    # measured on `smoke` above (ah-vzj9); this job is skipped outright on a prose-only PR, so it
    # pays none of it.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the WebAssembly core
        uses: actions/download-artifact@v4
        with:
          name: wasm-core
          path: packages/browser-core/src/wasm

      # `vite build` rather than the `build` script, which is `build:wasm && vite build`. The module
      # is already here, and rebuilding it would drag the Rust toolchain into a job that has none.
      - name: Build the web application
        run: pnpm --filter @atlantis/web exec vite build

      - name: Run the PWA tests
        run: pnpm run test:pwa

      - name: Upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pwa
          path: test-results
          retention-days: 7

  # The Tauri binary is gated behind `any(target_os = "linux", target_os = "macos", target_os = "windows")`
  # and the `desktop-runtime` feature. Without that feature the Linux jobs above compile the shell
  # without tauri and its native system-library dependencies. A missing dependency in the desktop
  # shell reached a developer's machine before this job existed.
  desktop-shell:
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check the native desktop shell
        run: cargo check -p atlantis-hud-desktop-shell --features desktop-runtime

      - name: Clippy the native desktop shell
        run: cargo clippy -p atlantis-hud-desktop-shell --features desktop-runtime -- -D warnings

  # The macOS job above proves the shell compiles; this one proves its commands work. WebdriverIO
  # talks to tauri-driver, which launches the real release binary under xvfb - so every assertion
  # crosses genuine Tauri IPC, which no browser-hosted suite ever does. Linux rather than macOS,
  # because WebKitGTK is the one webview that exposes a WebDriver endpoint at all: WKWebView
  # cannot be driven, and an argument that fails to bind fails identically on every platform.
  native:
    runs-on: ubuntu-latest
    needs: [changes, wasm]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.native == 'true'
    # The largest hang surface in the workflow - xvfb, a native webview and a fixed port - so
    # unlike its siblings this job carries its own ceiling.
    timeout-minutes: 30
    env:
      TAURI_DRIVER_VERSION: 2.0.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The -dev packages are what `tauri build` links against; webkit2gtk-driver is the
      # WebKitWebDriver binary tauri-driver proxies to; xvfb gives the app a display.
      #
      # This is the last apt step in the workflow, and so the last place the stall class ah-3c80
      # measured can still land: `apt-get update && install` sitting in_progress for 25-55 minutes,
      # four times in five days. `smoke` and `pwa` escaped it by moving into the Playwright image
      # (ah-f9q9); that image carries no Tauri or WebDriver packages, so it is not available here.
      # The job's `timeout-minutes: 30` above does not help - a stalled apt burns most of half an
      # hour and the suite it was meant to protect never runs at all.
      #
      # So the step bounds itself instead. Each attempt gets five minutes - two for `update`, three
      # for `install`. The step has taken 20-45 seconds over ten real runs (measured 2026-08-21),
      # so that is roughly seven times the worst working case: loose enough that a slow-but-working
      # mirror is never killed, tight enough that a stall is a fast failure. One retry covers the
      # common case of a single bad mirror. `timeout-minutes` on the step is the outer belt for the
      # two attempts and the sleep.
      #
      # No apt cache: every option needs a third-party action, and this is the one job that builds
      # a release binary. If the stall survives this bounding, the next step is a prebuilt image
      # carrying these six packages - which removes the step entirely, and costs a registry, a
      # publishing pipeline and a rebuild whenever the list changes. That is the known answer for
      # a third sighting; it is deliberately not taken here (ah-j6j7).
      - name: Install system dependencies
        timeout-minutes: 11
        run: |
          # Each apt command is `timeout`'s own direct child, and `timeout` runs under sudo rather
          # than over it. Both matter: `timeout` signals only the process it started, so a shell
          # wrapper would leave the stalled apt orphaned underneath it, and an unprivileged
          # `timeout` could not kill a privileged apt even if it did reach it. `-k` follows an
          # ignored TERM with a KILL, since a stall is exactly the state where a graceful stop may
          # not arrive.
          for attempt in 1 2; do
            if sudo timeout -k 30s 120s apt-get update \
              && sudo timeout -k 30s 180s apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libxdo-dev webkit2gtk-driver xvfb; then
              exit 0
            fi
            echo "::warning::apt install attempt $attempt failed or timed out"
            if [ "$attempt" = 1 ]; then sleep 10; fi
          done
          echo "::error::apt install failed twice; see the warnings above"
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Its own key: this is the only job building the workspace with the desktop-runtime
      # feature, so sharing the `native` cache would just thrash both. Saved even on a failed
      # run, so a red suite still leaves the next run a warm build.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-e2e
          cache-on-failure: true

      - name: Cache tauri-driver
        id: tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ env.TAURI_DRIVER_VERSION }}

      - name: Install tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version ${{ env.TAURI_DRIVER_VERSION }} --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The native suite lives outside the pnpm workspaces, so the recursive typecheck in the
      # checks job never sees it; this is the one place it is held to compile.
      - name: Typecheck the native suite
        run: pnpm exec tsc -p tests/native/tsconfig.json

      - name: Download the WebAssembly core
        uses: actions/download-artifact@v4
        with:
          name: wasm-core
          path: packages/browser-core/src/wasm

      # `vite build` directly, then `tauri build` with the hook nulled out: the configured
      # `beforeBuildCommand` chains `build:wasm`, which rebuilds the module unconditionally and
      # would drag wasm-pack into a job whose module just arrived as an artifact.
      - name: Build the desktop frontend
        run: pnpm --filter @atlantis/desktop exec vite build

      # Debug profile: the suite asserts argument binding and rows in a database, which no
      # optimization level can change, and the release build costs four minutes a run against
      # the debug build's one. The optimized binary ships from the release workflow, not here.
      - name: Build the native shell
        run: >-
          pnpm --filter @atlantis/desktop exec tauri build --debug --no-bundle
          --features desktop-runtime
          --config '{"build":{"beforeBuildCommand":null}}'

      - name: Run the native end-to-end tests
        run: xvfb-run --auto-servernum pnpm run test:native

      - name: Upload the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-results
          path: test-results/native
          retention-days: 7
