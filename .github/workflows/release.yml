# Cutting a macOS release.
#
# A tag rather than a merge: a full `tauri build` is minutes of compilation, and putting it on every
# pull request would undo the work that got this pipeline down to about five. The tag is also the
# only record of what shipped, so the version it claims is checked against the files that produce
# it before anything is built.
#
# The artifact is not notarized. That needs a paid Apple Developer Program membership and there is
# no free path to one, so Tauri ad-hoc signs instead and the download arrives with Gatekeeper's
# quarantine flag on it. See the release notes below, and `docs/issue-10-release-contracts.md`.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    name: macOS bundle
    runs-on: macos-latest
    permissions:
      # To create the release and attach the bundle to it.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # First, and before any compilation. A tag that disagrees with the manifests produces an
      # application whose About box and whose installer name different versions, and the cheapest
      # moment to notice is now rather than eight minutes from now. The same pairing is asserted on
      # every pull request by `packages/shared/src/appVersion.test.ts`; this adds the tag to it.
      - name: Check the tag against the versions it claims
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          tauri="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          echo "tag=$tag package.json=$package tauri.conf.json=$tauri"
          if [ "$tag" != "$package" ] || [ "$tag" != "$tauri" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($package) and tauri.conf.json ($tauri)."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The bundle is universal (#56), so both halves are named rather than leaning on the
          # host's - macos-latest is Apple Silicon and would otherwise supply only that one. The
          # wasm target is a third thing: `tauri build` runs the frontend build first, and that
          # builds the core for the browser - the desktop shell falls back to it when there is no
          # IPC.
          targets: wasm32-unknown-unknown, aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Signing turns itself on the day the credentials exist and stays off until then.
      #
      # The variables are exported here rather than set on the build step, because an unset secret
      # interpolates to an empty string and an empty string is still a set environment variable -
      # which Tauri reads as "sign", and then fails importing a certificate that is not there.
      - name: Enable signing if the credentials are configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No Apple credentials configured. The bundle will be ad-hoc signed and will need its quarantine flag cleared on first launch."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "::notice::Apple credentials found. Signing and notarizing."

      # `beforeBuildCommand` in tauri.conf.json already chains the wasm build and `vite build`, so
      # this one command produces the frontend and the bundle together.
      #
      # `--target universal-apple-darwin` compiles the shell twice and lipos the two into one
      # binary, so the release page offers a single macOS file that runs on Apple Silicon and on
      # Intel and nobody can download the wrong one. It also moves the bundle: a named target
      # builds into `target/<triple>/release/` rather than `target/release/`, which the upload
      # below has to follow.
      - name: Build the macOS bundle
        run: pnpm --filter @atlantis/desktop exec tauri build --features desktop-runtime --target universal-apple-darwin

      # `tauri build` reports success for a universal target whether or not both slices ended up in
      # the binary, and an arm64-only bundle looks exactly like this one until somebody on an Intel
      # Mac double-clicks the download. Eight minutes of compile is the wrong place to stop being
      # careful.
      - name: Check the bundle carries both architectures
        run: |
          # The executable is named for the Cargo package rather than for `productName`, and those
          # are two different files to keep in step - so it is matched rather than spelled out.
          # There is exactly one thing in `MacOS/`; if there is not, `lipo` says so and fails.
          app="target/universal-apple-darwin/release/bundle/macos/Atlantis HUD.app"
          archs="$(lipo -archs "$app/Contents/MacOS/"*)"
          echo "archs=$archs"
          for want in x86_64 arm64; do
            case " $archs " in
              *" $want "*) ;;
              *)
                echo "::error::The bundle has no $want slice (lipo reports: $archs)."
                exit 1
                ;;
            esac
          done

      - name: Upload the macOS bundle
        uses: actions/upload-artifact@v6
        with:
          name: macos-bundle
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Linux bundle
        run: pnpm --filter @atlantis/desktop exec tauri build --features desktop-runtime --bundles appimage

      - name: Upload the Linux bundle
        uses: actions/upload-artifact@v6
        with:
          name: linux-bundle
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows bundle
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Windows bundle
        run: pnpm --filter @atlantis/desktop exec tauri build --features desktop-runtime --bundles nsis

      - name: Upload the Windows bundle
        uses: actions/upload-artifact@v6
        with:
          name: windows-bundle
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Builds the self-contained web deployment tarball attached to the release, so anyone who wants
  # to host the client themselves can unpack one file into a served directory rather than
  # reproducing the Rust/wasm-pack/pnpm toolchain (ah-4sh). Modelled on `deploy.yml`'s build half,
  # since it needs the same bytes deploy.yml publishes - but this job produces an artifact instead
  # of uploading anywhere, and `deploy.yml` itself is untouched.
  web-tarball:
    name: Web self-hosting tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The same ceiling as `ci.yml`'s browser jobs and for the same reason - this job reaches apt
    # through `playwright install-deps` on every run, and that step has stalled 25-55 minutes
    # (ah-3c80). Larger than `smoke`'s 15 because this job also builds the Rust wasm core, so its
    # honest runtime is longer; the point is bounding an hour-long stall, not budgeting the work.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Same guard as macos: the tarball's name embeds the tag, so a mismatch here would ship a
      # mislabelled file rather than fail loudly.
      - name: Check the tag against the versions it claims
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          tauri="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          echo "tag=$tag package.json=$package tauri.conf.json=$tauri"
          if [ "$tag" != "$package" ] || [ "$tag" != "$tauri" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($package) and tauri.conf.json ($tauri)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        uses: ./.github/actions/playwright-browser

      - name: Build the web application
        run: pnpm run build:web

      # Against the very bytes that are about to be packed, not a rebuild of them - the release
      # must not attach an untested build. deploy.yml repeats this on an identical build later, but
      # that runs after publish, too late to stop a broken asset reaching the release page.
      - name: Verify the build that is about to be packed
        run: pnpm run test:pwa

      # A fresh build every time (never a leftover dist/ from a local `pnpm run check`, which
      # disables the service worker) - packed under a top-level directory that carries the version,
      # with the docs and server samples alongside the site rather than inside it, so the docs are
      # never accidentally web-served.
      - name: Stage and pack the tarball
        run: |
          stage="atlantis-hud-web-${GITHUB_REF_NAME}"
          mkdir -p "$stage/site" "$stage/server-samples"
          cp -R apps/web/dist/. "$stage/site/"
          cp docs/self-hosting/README.md "$stage/README.md"
          cp docs/self-hosting/nginx.conf "$stage/server-samples/nginx.conf"
          cp docs/self-hosting/apache.conf "$stage/server-samples/apache.conf"
          tar -czf "${stage}.tar.gz" "$stage"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      # Canaries for a build accidentally run with the PWA disabled or from a stale dist/ - a local
      # `pnpm run check` build omits sw.js and manifest.webmanifest, and either missing here means
      # the tarball would ship a client that never installs or works offline.
      - name: Sanity-check the archive contents
        run: |
          listing="$(tar -tzf "${STAGE}.tar.gz")"
          for want in \
            "$STAGE/site/index.html" \
            "$STAGE/site/sw.js" \
            "$STAGE/site/manifest.webmanifest" \
            "$STAGE/site/ruleset.json" \
            "$STAGE/README.md"; do
            if ! echo "$listing" | grep -qxF "$want"; then
              echo "::error::${STAGE}.tar.gz is missing $want. Was this built with the service worker disabled, or from a stale dist/?"
              exit 1
            fi
          done

      - name: Upload the web tarball
        uses: actions/upload-artifact@v6
        with:
          name: web-tarball
          path: atlantis-hud-web-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [macos, linux, windows, web-tarball]
    permissions:
      # To create the release and attach the bundles to it.
      contents: write
    steps:
      - name: Download the macOS bundle
        uses: actions/download-artifact@v7
        with:
          name: macos-bundle
          path: release-artifacts/macos

      - name: Download the Linux bundle
        uses: actions/download-artifact@v7
        with:
          name: linux-bundle
          path: release-artifacts/linux

      - name: Download the Windows bundle
        uses: actions/download-artifact@v7
        with:
          name: windows-bundle
          path: release-artifacts/windows

      - name: Download the web tarball
        uses: actions/download-artifact@v7
        with:
          name: web-tarball
          path: release-artifacts/web

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/macos/*.dmg
            release-artifacts/linux/*.AppImage
            release-artifacts/windows/*.exe
            release-artifacts/web/*.tar.gz
          # The "Installing" section below and README.md's "Getting Atlantis HUD" are a matched pair.
          # Change both, or neither - the Gatekeeper story here is the same one a README reader needs,
          # and it changes the day this build is notarized (ah-m0cj).
          body: |
            ## Installing

            **macOS**

            Download the `.dmg`, open it, and drag **Atlantis HUD** to Applications. There is one
            macOS download and it runs on both Apple Silicon and Intel Macs.

            This build is **not signed by Apple**, so macOS will refuse to open it the first time
            and say it is damaged. It is not. Clear the quarantine flag once:

            ```
            xattr -dr com.apple.quarantine "/Applications/Atlantis HUD.app"
            ```

            **Linux**

            Download the `.AppImage`, mark it executable, and run it:

            ```
            chmod +x Atlantis\ HUD_*.AppImage
            ./Atlantis\ HUD_*.AppImage
            ```

            **Windows**

            Download the `.exe` installer and run it. Windows SmartScreen may warn that the
            application is from an unknown publisher. Click **More info** → **Run anyway** to
            proceed.

            Signing and notarizing needs a paid Apple Developer Program membership; until there is
            one, this is the cost. See `docs/issue-10-release-contracts.md`.

            **Self-hosting the web client**

            Download `atlantis-hud-web-v<version>.tar.gz`, unpack it, and serve the `site/` directory from
            the root of an HTTPS domain. The included README covers server requirements; nginx and Apache
            samples are inside.

  # The website goes out with the release, from the same tag, in the same run.
  #
  # `needs: publish`, so a release is all or nothing: if either desktop bundle does not build, the
  # site is not republished either and the tag can be deleted and redone without anything having
  # escaped. The cost is real and worth naming - a Rust compile error, or a flaky runner, holds back
  # a web fix that was otherwise ready. `Deploy web` can still be run by hand when that happens,
  # which is the release valve.
  #
  # This calls deploy.yml rather than repeating it, so the tagged publish is the same publish as the
  # manual one: the same guards, the same PWA suite against the same bytes, the same check that the
  # live site changed.
  web:
    name: Website
    needs: publish
    uses: ./.github/workflows/deploy.yml
    # The called workflow needs the one.com credentials, and they are the caller's to pass.
    secrets: inherit
