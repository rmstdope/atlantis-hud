# Publishing the web application to atlantis-hud.kurelid.se.
#
# By hand, deliberately. There is one environment and it is the live one, so a push to main
# publishing straight to it leaves no moment at which somebody decides that this build should be
# the one people see. The button costs a press; the alternative costs a bad afternoon.
#
# Not GitHub Pages: this repository is private, and Pages from a private repository needs a paid
# plan and publishes a public site regardless - so it would cost money to get less.

name: Deploy web

on:
  workflow_dispatch:

# Serialised rather than cancelled. An interrupted upload leaves the site half-replaced, which is
# worse than waiting for the run in front to finish.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # A failing step rather than a job-level `if`. A skipped job reports as success, and a deploy
      # that quietly did not happen is the one failure mode this guard exists to prevent.
      - name: Refuse to publish anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Refusing to deploy ${{ github.ref }}. This workflow publishes to the live site, so it only runs on main."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # Checked before ten minutes of building rather than after. A missing secret is otherwise
      # discovered by the upload step, at the end, every time.
      - name: Check the publishing credentials are configured
        env:
          SERVER: ${{ secrets.ONECOM_FTP_SERVER }}
          USERNAME: ${{ secrets.ONECOM_FTP_USERNAME }}
          PASSWORD: ${{ secrets.ONECOM_FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.ONECOM_FTP_SERVER_DIR }}
        run: |
          missing=""
          [ -n "$SERVER" ] || missing="$missing ONECOM_FTP_SERVER(secret)"
          [ -n "$USERNAME" ] || missing="$missing ONECOM_FTP_USERNAME(secret)"
          [ -n "$PASSWORD" ] || missing="$missing ONECOM_FTP_PASSWORD(secret)"
          [ -n "$SERVER_DIR" ] || missing="$missing ONECOM_FTP_SERVER_DIR(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured to publish. Missing:$missing"
            exit 1
          fi
          echo "Publishing to $SERVER_DIR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Same key as CI's, so this run inherits a warm cache rather than compiling the core cold.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build the web application
        run: pnpm run build:web

      # Against the very bytes that are about to be uploaded, not a rebuild of them. CI already
      # tested this commit, but CI tested a build it made itself.
      - name: Verify the build that is about to be published
        run: pnpm run test:pwa

      # SFTP, over SSH. one.com does not answer FTPS - it aborts the TLS handshake outright - and
      # SFTP is a different protocol rather than a flag, so `SamKirkland/FTP-Deploy-Action` cannot
      # reach this host at all: it speaks ftp, ftps and ftps-legacy only.
      #
      # lftp rather than one of the SFTP actions, because it authenticates with a password without
      # needing an SSH key on the account, and because `mirror` is a recursive upload with retries
      # rather than a loop over `put`. The whole site is about 1.3 MB, so there is nothing to gain
      # from being cleverer than that.
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Publish over SFTP
        env:
          SERVER: ${{ secrets.ONECOM_FTP_SERVER }}
          USERNAME: ${{ secrets.ONECOM_FTP_USERNAME }}
          # `--env-password` reads this rather than taking the password on the command line, where
          # it would be visible to anything that can list processes on the runner.
          LFTP_PASSWORD: ${{ secrets.ONECOM_FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.ONECOM_FTP_SERVER_DIR }}
          PORT: ${{ vars.ONECOM_SFTP_PORT || '22' }}
        run: |
          lftp -u "$USERNAME" --env-password "sftp://$SERVER:$PORT" <<LFTP
          # Stop at the first command that fails, rather than carrying on to `bye` and exiting on
          # its status. A refused connection fails the job either way - that much was measured - but
          # a partial failure part-way through the script would otherwise be reported as success.
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          set mirror:parallel-transfer-count 4
          mirror --reverse --verbose --continue "apps/web/dist/" "$SERVER_DIR"
          bye
          LFTP

          # No --delete, on purpose. Vite names its assets by content hash, so an old file is never
          # overwritten by a different one - it is simply no longer referenced. Removing them would
          # break exactly the client this is most careful about: a browser holding a cached service
          # worker that is still asking for the previous build's chunk names. They cost kilobytes.

      # Proof rather than assumption. An upload can succeed into a directory the web server does not
      # serve - which is the mistake `ONECOM_FTP_SERVER_DIR` invites - and the job would otherwise
      # report success over a site that never changed.
      - name: Check the site is serving what was uploaded
        run: |
          site="https://atlantis-hud.kurelid.se"
          for attempt in 1 2 3; do
            status="$(curl -sS -o page.html -w '%{http_code}' --max-time 30 "$site/" || echo 000)"
            [ "$status" = "200" ] && break
            echo "Attempt $attempt: $site/ returned $status"
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "::error::$site/ returned $status. Is ONECOM_FTP_SERVER_DIR the directory this domain serves, and is HTTPS enabled?"
            exit 1
          fi
          if ! grep -q "manifest.webmanifest" page.html; then
            echo "::error::$site/ answered, but the page served is not this build - no manifest link in it."
            exit 1
          fi
          manifest="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$site/manifest.webmanifest" || echo 000)"
          if [ "$manifest" != "200" ]; then
            echo "::error::The manifest returned $manifest. Without it the application cannot be installed."
            exit 1
          fi
          echo "::notice::Published to $site"
