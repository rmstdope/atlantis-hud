# Dependabot version updates (ah-9yj4w).
#
# Daily, one pull request per dependency: the navigator's choice (2026-11-24), except the React
# packages (ah-6gn7c) and the @wdio packages (ah-m2l9m), grouped on the npm entry below. Cerebro's
# dependabot-sweep merges a pull request whose CI passed and files a red one as a bugfix bead
# (`.cerebro/cerebro/agents/orchestrator.md`, "Dependabot pull requests").
#
# The .cerebro/cerebro submodule is deliberately absent: the fleet harness changes how every agent
# works, so bumping it stays a deliberate act by the navigator.
version: 2
updates:
  # The pnpm workspace: package.json, pnpm-workspace.yaml and pnpm-lock.yaml at the root cover
  # apps/* and packages/*.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # The first exception to one pull request per dependency (ah-6gn7c): react-dom moving ahead of
    # react broke CI on #1978 (fixed by hand in ah-h05yn), so the four React packages bump together.
    # Exact names, so no other react-* package is swept in.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # A group with no applies-to covers version updates only; security updates need their own.
      react-security:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        applies-to: security-updates
      # The second exception (ah-m2l9m): @wdio/spec-reporter 10 merged on its own (#2004) while
      # @wdio/cli 10 failed the native typecheck (#2003), leaving WebdriverIO 9 and 10 side by side.
      # A pattern, so a @wdio package added later is covered too.
      wdio:
        patterns:
          - "@wdio/*"
      wdio-security:
        patterns:
          - "@wdio/*"
        applies-to: security-updates

  # The Cargo workspace: Cargo.toml and Cargo.lock at the root cover crates/* and
  # apps/desktop/src-tauri.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"

  # "/" reads .github/workflows; the composite action is named in an entry of its own, each with
  # the singular `directory` key.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/.github/actions/playwright-browser"
    schedule:
      interval: "daily"
