[package]
name = "atlantis-hud-desktop-shell"
version = "0.1.0"
edition = "2021"

[features]
default = []
desktop-runtime = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atlantis-hud-core = { path = "../../../crates/core" }
atlantis-hud-core-tauri = { path = "../../../crates/core-tauri" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
# Handing a URL to the operating system. Gated with `tauri` itself, because the Linux jobs never
# compile the shell at all and pulling this in unconditionally would give them something to build.
tauri-plugin-opener = "2"
