[package]
name = "atlantis-hud-desktop-shell"
version = "0.1.0"
edition = "2021"

[features]
default = []
desktop-runtime = [
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-fs",
  "dep:tauri-plugin-http",
  "atlantis-hud-core-tauri/tauri",
  "dep:atlantis-hud-assistant-mcp",
  "dep:serde_json",
  "dep:serde",
  "dep:tokio",
  "dep:uuid",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atlantis-hud-core = { path = "../../../crates/core" }
atlantis-hud-core-tauri = { path = "../../../crates/core-tauri" }
# The MCP server an assistant such as Claude Code connects to; its tools are answered by the
# frontend (crates/assistant-mcp). Gated with the rest of the desktop runtime.
atlantis-hud-assistant-mcp = { path = "../../../crates/assistant-mcp", optional = true }
serde_json = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
tokio = { version = "1", features = ["net"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tauri = { version = "2", optional = true, default-features = false, features = ["wry"] }
# Handing a URL to the operating system. Gated behind desktop-runtime so the native system
# libraries are only required when actually building the desktop shell.
tauri-plugin-opener = { version = "2", optional = true }
# Asking the operating system where to put a file, and then writing it there. The map export is
# what needs them: a browser download cannot tell the player where the file went, and on the
# desktop that is the one thing they want to know. Gated with the rest of the desktop runtime.
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
# Posting orders to the game server. Gated behind desktop-runtime for the same reason the others
# are, and scoped in capabilities/default.json to the one host the upload goes to.
tauri-plugin-http = { version = "2", optional = true }
