[package]
name = "atlantis-hud-desktop-shell"
version = "0.1.0"
edition = "2021"

[features]
default = []
desktop-runtime = ["dep:tauri", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atlantis-hud-core = { path = "../../../crates/core" }
atlantis-hud-core-tauri = { path = "../../../crates/core-tauri" }
tauri = { version = "2", optional = true, default-features = false, features = ["wry"] }
# Handing a URL to the operating system. Gated behind desktop-runtime so the native system
# libraries are only required when actually building the desktop shell.
tauri-plugin-opener = { version = "2", optional = true }
