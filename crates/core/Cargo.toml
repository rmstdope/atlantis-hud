[package]
name = "atlantis-hud-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[dev-dependencies]
serde_json = "1.0"
atlantis-hud-fixtures = { path = "../fixtures" }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
