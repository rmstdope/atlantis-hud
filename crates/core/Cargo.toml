[package]
name = "atlantis-hud-core"
version = "0.1.0"
edition = "2021"
# Integration tests are declared below rather than discovered, so that they build into two
# programs instead of one per file and run in parallel (ah-dt118). `tests/integration.rs` has
# a test that fails when a file in `tests/` is not declared there.
autotests = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"


[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "movement"
path = "tests/movement/main.rs"

[dev-dependencies]
serde_json = "1.0"
atlantis-hud-fixtures = { path = "../fixtures" }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
