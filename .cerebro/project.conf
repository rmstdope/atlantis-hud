# Atlantis HUD's own project facts, read by .claude/cerebro/scripts/project-conf (ah-qled.1).
#
#   key value        one per line; the value runs to the END of the line
#   # a comment      everything from a `#' on is a comment, WHEREVER it starts
#
# Because the comment strip runs wherever the `#' appears, A VALUE CAN NEVER CONTAIN `#'.
#
# TRACKED on purpose, unlike the personal .cerebro/models.conf: these are facts every clone needs,
# and a file under the git-ignored .cerebro/ vanishes on a fresh clone - so every new machine
# silently skips the step and it surfaces much later as a confusing failure inside a worktree.
#
# There is deliberately no `bead_prefix' here: `bd config get issue_prefix' already knows, and a
# duplicate is a second source of truth that will drift.

project_name   Atlantis HUD
default_branch main
app_paths      ^(packages|crates|apps)/
audience_noun  player
install        pnpm install --frozen-lockfile
prewarm        pnpm --filter @atlantis/browser-core build:wasm
gate_fast      pnpm run check:fast
gate_full      pnpm run check
reclaim_dirs   target node_modules

# What in this history is NOT a delivery: plan-bead's mockup commit. Declared rather than built into
# sweep-claims.sh since ah-qled.4 - excluding a subject nobody else writes is this project's
# convention, so the key defaults to excluding nothing and a consumer that wants it says so. Without
# this line a mockup-only bead reads as delivered and Cerebro's claim sweep would close it.
non_delivery_commit_pattern docs({id}): mockup
retro_dir      docs/retrospectives

# The least free disk worth starting a bead with, read by both .claude/cerebro/scripts/disk-preflight
# and prune-worktrees.sh's pressure path (ah-qled.7.2) - one number, so the check that refuses a bead
# and the sweep that frees space for it can never disagree. Eight: one fresh worktree's own build
# tree at its observed worst (~3.5 GB), the same again for the build the bead is about to run, and a
# gigabyte of slack. ABSENT would mean no preflight at all.
disk_floor_gb  8
mockup_dir     docs/ui
release_cmd    pnpm run release

# release_watch  - the GitHub Actions workflow the tag push starts, if there is one. ABSENT means
#                  there is nothing to watch after tagging, which is an ordinary state.
release_watch  Release

# How this application is STARTED (ah-qled.8). `launch_targets' is the index a role iterates;
# `launch_<name>' is the command and `launch_<name>_port' the port it will serve on. Flat keys
# rather than a list of records because a value here runs to the end of the line and `lookup'
# returns only the first match - so records and repeated keys are both unexpressible. A note is
# just a comment line, which is why there is no `notes' field.
#
# WITHOUT THESE, every verification and every UX review stops and asks the navigator how to run the
# app. That is the designed behaviour when a project has not said - never a guessed command - so
# these lines are what keep Psylocke and Cypher launching the real thing unattended.
launch_targets      web desktop

launch_web          pnpm --filter @atlantis/web dev
launch_web_port     5173

# `--features desktop-runtime' is LOAD-BEARING: without it cargo builds the stub `main', which
# exits at once, and the symptom looks like a broken application rather than a lost flag. Tauri v2's
# own beforeDevCommand starts vite on 4174 with --strictPort.
launch_desktop      pnpm --filter @atlantis/desktop exec tauri dev --features desktop-runtime
launch_desktop_port 4174

# Port blocks for the browser suites: blocks are `port_block_size' apart starting at `port_base',
# and each session takes one and checks it is free first. `port_env' is the variable this project's
# suites actually read.
port_base       4173
port_block_size 10
port_env        SMOKE_PORT_BASE

# What describes this project's fixtures, for a role choosing one that exercises what a bead
# changed. Absent would mean the step is skipped rather than a hunt for fixtures we never declared.
fixtures_doc    tests/fixtures/reports/README.md
